<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>EchoEx - Visão Geral</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .location-card {
            display: block;
            position: relative;
            height: 180px;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid #3a5d2e;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .location-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .location-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.3s;
        }

        .location-card:hover img {
            filter: brightness(0.85);
        }

        .location-card h2 {
            position: absolute;
            right: 25px;
            bottom: 15px;
            color: white;
            font-size: 42px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <!-- Menu Lateral Completo -->
    <aside class="sidebar">
        <div>
            <div class="logo-container">
                <div class="logo-circle"><i class="fa-solid fa-bicycle fa-xl"></i></div>
                <div class="logo-text">ECHO EX</div>
            </div>
            <div class="nav-section">
                <div class="section-title">Operação</div>
                <a href="visao-geral.html" class="nav-item active"><i class="fa-solid fa-house"></i> Visão Geral</a>
                <a href="receber-pacotes.html" class="nav-item"><i class="fa-solid fa-arrow-down"></i> Receber Pacotes</a>
                <a href="pacotes-armazenados.html" class="nav-item"><i class="fa-solid fa-box"></i> Pacotes Armazenados</a>
                <a href="coleta-pacotes.html" class="nav-item"><i class="fa-solid fa-truck"></i> Coleta de Pacotes</a>
            </div>
            <div class="nav-section">
                <div class="section-title">Operação</div>
                <a href="horarios-capacidade.html" class="nav-item"><i class="fa-solid fa-clock"></i> Horários e Capacidade</a>
                <a href="remuneracao.html" class="nav-item"><i class="fa-solid fa-money-bill-wave"></i> Remuneração</a>
            </div>
        </div>

        <!-- Perfil sem foto -->
        <a href="perfil.html" class="user-profile">
            <div class="avatar-placeholder"><i class="fa-solid fa-user"></i></div>
            <div class="user-info">
                <h4>Natan peninha</h4>
                <p>Centro Ativo</p>
            </div>
        </a>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="main-content">
        <header class="top-bar">
            <div class="top-bar-left">
                <!-- Seta de Voltar para a página anterior/menu -->
                <a href="javascript:history.back()" class="btn-back" title="Voltar"><i class="fa-solid fa-arrow-left"></i></a>
                <div class="page-title">Operação / <span>Visão Geral</span></div>
            </div>
            <div class="help-btn">?</div>
        </header>

        <section class="content-body">
            <h3 style="color: #3a5d2e; font-size: 18px; margin-bottom: 5px;">PONTO PARCEIRO</h3>
            <h1 style="font-size: 36px; margin-bottom: 25px;">Centro Logístico</h1>

            <div style="display: flex; flex-direction: column; gap: 20px;">
                <!-- Cartão Clicável 1: Recife -->
                <a href="horarios-capacidade.html" class="location-card">
                    <img src="https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=1000" alt="Recife">
                    <h2>Recife</h2>
                </a>

                <!-- Cartão Clicável 2: Olinda -->
                <a href="coleta-pacotes.html" class="location-card">
                    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1000" alt="Olinda">
                    <h2>Olinda</h2>
                </a>
            </div>
        </section>
    </main>
