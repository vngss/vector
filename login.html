<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoEx - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #3a5d2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: white; padding: 40px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        .logo-box { background: #3a5d2e; color: white; text-align: center; font-weight: 900; font-size: 24px; padding: 8px; border-radius: 8px; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: #475569; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; }
        .btn-submit { width: 100%; background: #3a5d2e; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .back-link { display: block; text-align: center; margin-top: 16px; color: #64748b; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-box">ECHO EX</div>
        <h2 style="text-align: center; margin-bottom: 20px; color: #1e293b;">Acessar a Plataforma</h2>
        <form action="visao-geral.html">
            <div class="form-group">
                <label>E-mail ou Usuário</label>
                <input type="text" placeholder="natan.peninha@echoex.com" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" value="12345678" required>
            </div>
            <button type="submit" class="btn-submit">Entrar no Sistema</button>
        </form>
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Voltar à página inicial</a>
    </div>

</body>
</html>
