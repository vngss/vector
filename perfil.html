<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoEx - Perfil do Operador</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; min-height: 100vh; background-color: #f0f0f0; }

        .sidebar { width: 320px; background-color: #3A5D2E; color: white; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0; }
        .logo-container { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; text-decoration: none; color: white; }
        .logo-circle { width: 55px; height: 55px; border: 3px solid white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .logo-text { font-size: 28px; font-weight: 900; letter-spacing: 2px; background: white; color: #3A5D2E; padding: 2px 10px; border-radius: 4px; }
        
        .nav-section { margin-bottom: 25px; }
        .section-title { font-size: 20px; opacity: 0.85; margin-bottom: 12px; font-weight: 300; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: white; text-decoration: none; font-size: 18px; border-radius: 20px; margin-bottom: 8px; }
        .nav-item:hover { background-color: rgba(255, 255, 255, 0.15); }
        .nav-item i { width: 25px; text-align: center; font-size: 20px; }

        .user-profile { border-top: 1px solid rgba(255, 255, 255, 0.3); padding-top: 20px; display: flex; align-items: center; gap: 15px; text-decoration: none; color: white; }
        .avatar-blank { width: 50px; height: 50px; background-color: white; border-radius: 50%; flex-shrink: 0; }
        .user-info h4 { font-size: 18px; font-weight: bold; }
        .user-info p { font-size: 13px; opacity: 0.8; }

        .main-content { flex: 1; display: flex; flex-direction: column; }
        .top-bar { background-color: white; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ccc; }
        .top-bar-left { display: flex; align-items: center; gap: 15px; }
        .btn-back { background: #e0e0e0; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #333; font-size: 18px; text-decoration: none; }
        .page-title { font-size: 24px; font-weight: bold; color: #333; }
        .page-title span { font-weight: normal; }
        .help-btn { width: 45px; height: 45px; border: 2px solid #333; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: #333; }
        .content-body { padding: 30px; flex: 1; }

        /* Estilos do Perfil sem Foto */
        .profile-card { background: white; border-radius: 20px; padding: 25px; display: flex; align-items: center; gap: 25px; border: 3px solid #3A5D2E; margin-bottom: 25px; }
        .profile-icon { width: 80px; height: 80px; border-radius: 50%; background-color: #e0e0e0; color: #3A5D2E; display: flex; align-items: center; justify-content: center; font-size: 36px; border: 3px solid #3A5D2E; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .info-card { background: white; padding: 20px; border-radius: 15px; border: 2px solid #ccc; }
        .info-card h4 { color: #666; font-size: 14px; text-transform: uppercase; margin-bottom: 6px; }
        .info-card p { font-size: 18px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div>
            <a href="index.html" class="logo-container">
                <div class="logo-circle"><i class="fa-solid fa-bicycle"></i></div>
                <div class="logo-text">ECHO EX</div>
            </a>
            <div class="nav-section">
                <div class="section-title">Operação</div>
