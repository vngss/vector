<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>EchoEx - Remuneração</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <aside class="sidebar">
        <div>
            <div class="logo-container">
                <div class="logo-circle"><i class="fa-solid fa-bicycle fa-xl"></i></div>
                <div class="logo-text">ECHO EX</div>
            </div>
            <div class="nav-section">
                <div class="section-title">Operação</div>
                <a href="visao-geral.html" class="nav-item"><i class="fa-solid fa-house"></i> Visão Geral</a>
                <a href="receber-pacotes.html" class="nav-item"><i class="fa-solid fa-arrow-down"></i> Receber Pacotes</a>
                <a href="pacotes-armazenados.html" class="nav-item"><i class="fa-solid fa-box"></i> Pacotes Armazenados</a>
                <a href="coleta-pacotes.html" class="nav-item"><i class="fa-solid fa-truck"></i> Coleta de Pacotes</a>
            </div>
            <div class="nav-section">
                <div class="section-title">Operação</div>
                <a href="horarios-capacidade.html" class="nav-item"><i class="fa-solid fa-clock"></i> Horários e Capacidade</a>
                <a href="remuneracao.html" class="nav-item active"><i class="fa-solid fa-money-bill-wave"></i> Remuneração</a>
            </div>
        </div>

        <a href="perfil.html" class="user-profile">
            <div class="avatar-placeholder"><i class="fa-solid fa-user"></i></div>
            <div class="user-info">
                <h4>alguem</h4>
                <p>Centro Ativo</p>
            </div>
        </a>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <div class="top-bar-left">
                <a href="javascript:history.back()" class="btn-back" title="Voltar"><i class="fa-solid fa-arrow-left"></i></a>
                <div class="page-title">Operação / <span>Remuneração</span></div>
            </div>
            <div class="help-btn">?</div>
        </header>

        <section class="content-body">
            <h1 style="font-size: 32px; margin-bottom: 15px;">Lucros do mês</h1>
            <div style="background-color: #b5d4a3; border-radius: 25px; padding: 20px; margin-bottom: 30px;">
                <canvas id="lucrosChart" style="max-height: 250px;"></canvas>
            </div>

            <h1 style="font-size: 32px; margin-bottom: 15px;">Lucros da semana</h1>
            <div style="background-color: #b5d4a3; border-radius: 25px; height: 180px;"></div>
        </section>
    </main>

    <script>
        const ctx = document.getElementById('lucrosChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Vendas', 'Finanças', 'Marketing', 'RH'],
                datasets: [{
                    label: 'Lucro',
                    data: [75, 60, 45, 30],
                    backgroundColor: '#5383EC',
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, max: 80 } }
            }
        });
    </script>

</body>
</html>
